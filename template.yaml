AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CasePacket — dark-web signal to LE-ready case packet (simulated fixtures only)

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures: [x86_64]
    Environment:
      Variables:
        TABLE_NAME: !Ref CaseTable
        BUCKET_NAME: !Ref DataBucket
        DEMO_API_KEY: !Ref DemoApiKey
        ENABLE_BEDROCK: !Ref EnableBedrock
        CASEPACKET_LOCAL: "0"
    Tracing: Active

Parameters:
  DemoApiKey:
    Type: String
    NoEcho: true
    Default: casepacket-demo-key
    Description: Shared x-api-key for the weekend demo (rotate after the event)
  EnableBedrock:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]

Resources:
  CaseTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CasePacket
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - content-type
          - x-api-key
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api.handler.lambda_handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref CompileStateMachine
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseTable
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt CompileStateMachine.Name
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: ingest.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseTable
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - S3WritePolicy:
            BucketName: !Ref DataBucket
      Events:
        RawCreated:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref DataBucket
                object:
                  key:
                    - prefix: raw/

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: extract.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseTable

  ScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: score.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseTable

  CompileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: compile.handler.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CaseTable
        - S3CrudPolicy:
            BucketName: !Ref DataBucket

  CompileStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: CasePacketCompile
      Type: STANDARD
      DefinitionUri: statemachine/casepacket.asl.json
      DefinitionSubstitutions:
        ExtractFunctionArn: !GetAtt ExtractFunction.Arn
        ScoreFunctionArn: !GetAtt ScoreFunction.Arn
        CompileFunctionArn: !GetAtt CompileFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ScoreFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CompileFunction

Outputs:
  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Description: Raw + packet bucket
    Value: !Ref DataBucket
  TableName:
    Description: DynamoDB table
    Value: !Ref CaseTable
  StateMachineArn:
    Description: CasePacketCompile ARN
    Value: !Ref CompileStateMachine
