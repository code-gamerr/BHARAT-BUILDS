AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CasePacket — LE dark-web intel triage (fixtures) for First Commit Ship It

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    Architectures: [x86_64]
    MemorySize: 256
    Environment:
      Variables:
        CASES_TABLE: !Ref CasesTable
        RAW_BUCKET: !Ref RawBucket
        PACKET_BUCKET: !Ref PacketBucket
        DEMO_API_KEY: !Ref DemoApiKey
        ENABLE_BEDROCK: !Ref EnableBedrock
        GRPO_GROUP_SIZE: !Sub "${GrpoGroupSize}"
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        GRPO_TRAIN_PROMPTS: "20"

Parameters:
  DemoApiKey:
    Type: String
    Default: casepacket-demo-key
    NoEcho: true
  AmplifyOrigin:
    Type: String
    Default: '*'
    Description: CORS origin for Amplify SPA
  EnableBedrock:
    Type: String
    Default: "0"
    AllowedValues: ["0", "1"]
    Description: Set 1 to attempt Bedrock enrich (packet still ships if it fails)
  GrpoGroupSize:
    Type: Number
    Default: 13
    MinValue: 13
    Description: Bedrock RFT GRPO group size (>12 per docs/ml.md)
  BedrockModelId:
    Type: String
    Default: ""
    Description: Optional Bedrock model id for enrich / RFT custom model

Resources:
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  PacketBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CasesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AmplifyOrigin
        AllowHeaders:
          - content-type
          - x-api-key
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: app.health
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CasesTable
        - S3ReadPolicy:
            BucketName: !Ref RawBucket
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /healthz
            Method: GET

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: app.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - S3CrudPolicy:
            BucketName: !Ref PacketBucket
        - S3ReadPolicy:
            BucketName: !Ref RawBucket
        - StepFunctionsExecutionPolicy:
            StateMachineName: !GetAtt CompileStateMachine.Name
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref CompileStateMachine
      Events:
        ListCases:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases
            Method: GET
        GetCase:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases/{id}
            Method: GET
        StartPacket:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases/{id}/packet
            Method: POST
        GetPacket:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /cases/{id}/packet
            Method: GET
        Ingest:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /ingest
            Method: POST

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/ingest/
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - S3ReadPolicy:
            BucketName: !Ref RawBucket
      Events:
        RawCreated:
          Type: S3
          Properties:
            Bucket: !Ref RawBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .json

  ExtractFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/extract/
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable

  ScoreFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/score/
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable

  CompileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/compile/
      Handler: handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable
        - S3CrudPolicy:
            BucketName: !Ref PacketBucket

  RewardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/reward/
      Handler: handler.handler
      Description: Bedrock RFT GRPO reward (group_size>12) — docs/ml.md
      Timeout: 10
      MemorySize: 128

  CompileStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Definition:
        Comment: CasePacketCompile — extract → score → render packet
        StartAt: ExtractEnrich
        States:
          ExtractEnrich:
            Type: Task
            Resource: !GetAtt ExtractFunction.Arn
            Next: ScoreCluster
            Catch:
              - ErrorEquals: ["States.ALL"]
                ResultPath: $.extractError
                Next: ScoreCluster
          ScoreCluster:
            Type: Task
            Resource: !GetAtt ScoreFunction.Arn
            Next: RenderPacket
          RenderPacket:
            Type: Task
            Resource: !GetAtt CompileFunction.Arn
            End: true
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref ExtractFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref ScoreFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref CompileFunction

Outputs:
  ApiUrl:
    Description: HTTP API endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  RawBucketName:
    Value: !Ref RawBucket
  PacketBucketName:
    Value: !Ref PacketBucket
  CasesTableName:
    Value: !Ref CasesTable
  StateMachineArn:
    Value: !Ref CompileStateMachine
  RewardFunctionArn:
    Description: Attach this ARN to Bedrock RFT job (GRPO group_size≥13)
    Value: !GetAtt RewardFunction.Arn
  AmplifyHint:
    Description: Point Amplify app root at web/ with VITE_API_URL=ApiUrl
    Value: !Sub "Set Amplify env VITE_API_URL=https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DemoApiKeyHint:
    Description: Use header x-api-key (value set at deploy)
    Value: "set via DemoApiKey parameter"
